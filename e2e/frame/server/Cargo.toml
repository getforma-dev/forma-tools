# The Rust half of the preview-frame e2e lane (FORMA-175): a small
# forma-server application that embeds what ../build-app.mjs built and serves
# forma-server's `PageResponse::frame` from it, as an application does
# (`PreviewFrame::load` at start, the frame route, the host page that frames
# it), for ../frame.spec.ts.
#
# `forma/` is a symlink to a checkout of getforma-dev/forma that ../build.sh
# creates (FORMA_DIR, default ../../forma from the repo root; in CI the
# workflow's `forma-checkout`). Path dependencies, not crates.io, as in the
# SSR lane (../../ssr/render): the lane tests the server this build ships
# alongside, not a release snapshot.
[package]
name = "forma-e2e-frame"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
forma-server = { path = "forma/crates/forma-server" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# `debug-embed`: the debug build embeds the output at compile time, as an
# application's release binary does, rather than reading the folder at run time.
rust-embed = { version = "8", features = ["debug-embed"] }
serde_json = "1"

# Standalone: never a member of any enclosing workspace. `forma/` is excluded
# because cargo would otherwise adopt path dependencies under this directory as
# members of this workspace.
[workspace]
exclude = ["forma"]
